<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tulip Bloom</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap">
<style>
/* layout: full-bleed black stage, botanical tulip center, particles behind, whisper-quiet caption */
:root {
  --void: #05070a;
  --void-2: #0b1016;
  --ink: #efe8dd;
  --muted: #6f7b79;
  --gold: #e8c87a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }

body {
  margin: 0;
  background:
    radial-gradient(ellipse 70% 55% at 50% 42%, #121a1e 0%, transparent 70%),
    radial-gradient(ellipse at 50% 100%, #0d1413 0%, transparent 60%),
    var(--void);
  color: var(--ink);
  font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

main {
  width: 100%;
  max-width: 520px;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.stage { width: 100%; flex: 1; min-height: 0; display: flex; justify-content: center; }
svg#scene { width: 100%; height: 100%; }

/* ─── growth choreography ─────────────────────────────── */

.stem-path {
  fill: none;
  stroke: url(#gStem);
  stroke-width: 7;
  stroke-linecap: round;
  stroke-dasharray: 380;
  stroke-dashoffset: 380;
  animation: draw 2.1s 0.35s cubic-bezier(.55,.08,.3,1) forwards;
}

.branch-path {
  fill: none;
  stroke: url(#gStem);
  stroke-width: 3.4;
  stroke-linecap: round;
  stroke-dasharray: 130;
  stroke-dashoffset: 130;
  animation: draw 1s 1.95s cubic-bezier(.55,.08,.3,1) forwards;
}

@keyframes draw { to { stroke-dashoffset: 0; } }

.leaf {
  transform-box: fill-box;
  transform: scale(0.08) rotate(var(--lr, 0deg));
  opacity: 0;
  animation: unfurl 1.25s cubic-bezier(.22,.9,.3,1) forwards;
}
.leaf-l  { transform-origin: 100% 100%; animation-delay: 1.45s; --lr: -14deg; }
.leaf-r  { transform-origin: 0% 100%;   animation-delay: 1.75s; --lr:  12deg; }
.leaf-lo { transform-origin: 100% 100%; animation-delay: 2.05s; --lr: -10deg; }

@keyframes unfurl { to { transform: scale(1) rotate(0deg); opacity: 1; } }

/* every petal starts folded into a tight bud, then opens */
.petal {
  transform-box: fill-box;
  transform-origin: 50% 100%;
  transform: rotate(0deg) scale(0.46, 0.58);
  opacity: 0;
  animation: bloom 1.5s cubic-bezier(.2,.85,.25,1) forwards;
}
@keyframes bloom {
  0%   { opacity: 0; }
  12%  { opacity: 1; }
  100% { transform: rotate(var(--r, 0deg)) scale(var(--s, 1)); opacity: 1; }
}

.p-back   { --r:   0deg; --s: 1.06; animation-delay: 2.55s; }
.p-bl     { --r: -20deg; --s: 1;    animation-delay: 2.80s; }
.p-br     { --r:  20deg; --s: 1;    animation-delay: 2.80s; }
.p-ml     { --r:  -9deg; --s: .96;  animation-delay: 3.10s; }
.p-mr     { --r:   9deg; --s: .96;  animation-delay: 3.10s; }
.p-front  { --r:   0deg; --s: .88;  animation-delay: 3.40s; }

.bud-petal {
  transform-box: fill-box;
  transform-origin: 50% 100%;
  transform: scale(0.1);
  opacity: 0;
  animation: unfurl 1.1s 2.75s cubic-bezier(.22,.9,.3,1) forwards;
}

.stamens {
  opacity: 0;
  animation: fade 1.2s 3.7s ease forwards;
}
@keyframes fade { to { opacity: 1; } }

.halo {
  opacity: 0;
  animation: fade 2.4s 2.9s ease forwards;
}

/* living sway, begins once grown */
.sway-plant {
  transform-box: fill-box;
  transform-origin: 50% 100%;
  animation: swayPlant 9s 3.2s ease-in-out infinite;
}
.sway-head {
  transform-box: fill-box;
  transform-origin: 50% 100%;
  animation: swayHead 7s 3.8s ease-in-out infinite;
}
@keyframes swayPlant {
  0%, 100% { transform: rotate(-0.7deg); }
  50%      { transform: rotate(0.7deg); }
}
@keyframes swayHead {
  0%, 100% { transform: rotate(1.1deg); }
  50%      { transform: rotate(-1.1deg); }
}

.mote { animation: drift linear infinite; }
@keyframes drift {
  0%   { opacity: 0; transform: translateY(0); }
  18%  { opacity: var(--peak, .7); }
  82%  { opacity: var(--peak, .7); }
  100% { opacity: 0; transform: translateY(-120px); }
}

/* ─── caption + control ───────────────────────────────── */

.caption {
  text-align: center;
  font-size: 1.22rem;
  font-weight: 300;
  font-style: italic;
  letter-spacing: 0.06em;
  color: var(--ink);
  opacity: 0;
  animation: fade 1.8s 4.6s ease forwards;
}
.caption span { color: var(--gold); }

button#replay {
  font-family: inherit;
  font-size: 0.92rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  background: none;
  border: 0;
  padding: 6px 10px;
  cursor: pointer;
  opacity: 0;
  animation: fade 1.4s 5.4s ease forwards;
  transition: color .3s;
}
button#replay:hover { color: var(--gold); }
button#replay:focus-visible { outline: 1px solid var(--gold); outline-offset: 4px; }

@media (prefers-reduced-motion: reduce) {
  .stem-path, .branch-path, .leaf, .petal, .bud-petal,
  .stamens, .halo, .caption, button#replay, .mote {
    animation: none !important;
    opacity: 1 !important;
    stroke-dashoffset: 0 !important;
  }
  .leaf, .bud-petal { transform: scale(1) !important; }
  .petal { transform: rotate(var(--r, 0deg)) scale(var(--s, 1)) !important; }
}
</style>
</head>
<body>

<main>
  <div class="stage">
    <svg id="scene" viewBox="0 0 400 600" preserveAspectRatio="xMidYMax meet">
      <defs>
        <linearGradient id="gStem" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%"   stop-color="#1f4a26"/>
          <stop offset="55%"  stop-color="#3d7f3c"/>
          <stop offset="100%" stop-color="#5ca352"/>
        </linearGradient>

        <linearGradient id="gLeaf" x1="1" y1="1" x2="0" y2="0">
          <stop offset="0%"   stop-color="#1b3f22"/>
          <stop offset="48%"  stop-color="#397a38"/>
          <stop offset="100%" stop-color="#63ad56"/>
        </linearGradient>

        <linearGradient id="gLeafB" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0%"   stop-color="#17351d"/>
          <stop offset="50%"  stop-color="#2f6b31"/>
          <stop offset="100%" stop-color="#53974a"/>
        </linearGradient>

        <linearGradient id="gDark" x1="0.5" y1="1" x2="0.5" y2="0">
          <stop offset="0%"   stop-color="#4e0c24"/>
          <stop offset="45%"  stop-color="#9c2146"/>
          <stop offset="100%" stop-color="#d9456b"/>
        </linearGradient>

        <linearGradient id="gMid" x1="0.5" y1="1" x2="0.5" y2="0">
          <stop offset="0%"   stop-color="#6d1230"/>
          <stop offset="42%"  stop-color="#c33a5e"/>
          <stop offset="100%" stop-color="#f87a95"/>
        </linearGradient>

        <linearGradient id="gLight" x1="0.5" y1="1" x2="0.5" y2="0">
          <stop offset="0%"   stop-color="#8e1b3a"/>
          <stop offset="38%"  stop-color="#e2577a"/>
          <stop offset="100%" stop-color="#ffc0cd"/>
        </linearGradient>

        <linearGradient id="gSheen" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
          <stop offset="70%"  stop-color="#ffffff" stop-opacity="0.16"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0.32"/>
        </linearGradient>

        <radialGradient id="gHalo" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="#ff9db0" stop-opacity="0.22"/>
          <stop offset="45%"  stop-color="#c4476a" stop-opacity="0.10"/>
          <stop offset="100%" stop-color="#c4476a" stop-opacity="0"/>
        </radialGradient>

        <radialGradient id="gSoil" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="#2a3b2c" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#2a3b2c" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <g id="particles"></g>

      <ellipse class="halo" cx="200" cy="168" rx="150" ry="150" fill="url(#gHalo)"/>
      <ellipse class="halo" cx="200" cy="586" rx="118" ry="17" fill="url(#gSoil)"/>

      <g class="sway-plant">
        <!-- stem -->
        <path class="stem-path" d="M200 586 C194 500 186 432 190 360 C193 310 197 280 200 252"/>

        <!-- side branch + closed bud -->
        <path class="branch-path" d="M189 404 C214 396 244 376 264 342"/>
        <g transform="rotate(27 266 340)">
          <path class="bud-petal" d="M266 340 C253 329 247 306 249 287 C251 270 258 262 266 260 C274 262 281 270 283 287 C285 306 279 329 266 340 Z" fill="url(#gMid)"/>
          <path class="bud-petal" d="M266 340 C260 330 257 307 259 288 C261 272 263 264 266 262 C269 264 271 272 273 288 C275 307 272 330 266 340 Z" fill="url(#gLight)" opacity="0.55"/>
        </g>

        <!-- leaves -->
        <g class="leaf leaf-l">
          <path d="M190 430 C146 408 102 352 78 262 C118 302 164 358 190 430 Z" fill="url(#gLeaf)"/>
          <path d="M190 430 C160 384 120 326 86 272" fill="none" stroke="#7cc06a" stroke-opacity="0.35" stroke-width="1.6"/>
        </g>
        <g class="leaf leaf-r">
          <path d="M192 392 C236 372 282 316 306 228 C266 268 220 322 192 392 Z" fill="url(#gLeafB)"/>
          <path d="M192 392 C224 342 266 286 300 238" fill="none" stroke="#7cc06a" stroke-opacity="0.3" stroke-width="1.5"/>
        </g>
        <g class="leaf leaf-lo">
          <path d="M186 496 C152 480 122 444 108 388 C136 418 168 456 186 496 Z" fill="url(#gLeafB)"/>
          <path d="M186 496 C162 462 136 428 114 396" fill="none" stroke="#7cc06a" stroke-opacity="0.28" stroke-width="1.3"/>
        </g>

        <!-- flower head -->
        <g class="sway-head">
          <!-- back petal -->
          <path class="petal p-back" d="M200 252 C179 235 167 197 168 157 C169 119 183 96 200 87 C217 96 231 119 232 157 C233 197 221 235 200 252 Z" fill="url(#gDark)"/>
          <!-- outer pair -->
          <path class="petal p-bl" d="M200 252 C179 235 167 197 168 157 C169 119 183 96 200 87 C217 96 231 119 232 157 C233 197 221 235 200 252 Z" fill="url(#gDark)"/>
          <path class="petal p-br" d="M200 252 C179 235 167 197 168 157 C169 119 183 96 200 87 C217 96 231 119 232 157 C233 197 221 235 200 252 Z" fill="url(#gDark)"/>
          <!-- mid pair -->
          <path class="petal p-ml" d="M200 252 C179 235 167 197 168 157 C169 119 183 96 200 87 C217 96 231 119 232 157 C233 197 221 235 200 252 Z" fill="url(#gMid)"/>
          <path class="petal p-mr" d="M200 252 C179 235 167 197 168 157 C169 119 183 96 200 87 C217 96 231 119 232 157 C233 197 221 235 200 252 Z" fill="url(#gMid)"/>

          <!-- stamens inside the cup -->
          <g class="stamens">
            <g stroke="#d8cfa8" stroke-width="1.7" stroke-linecap="round" fill="none" opacity="0.85">
              <path d="M200 244 C194 214 190 188 188 166"/>
              <path d="M200 244 C206 214 210 188 212 166"/>
              <path d="M200 244 C196 212 194 184 196 158"/>
              <path d="M200 244 C204 212 206 184 204 158"/>
            </g>
            <g fill="#3f2236">
              <ellipse cx="188" cy="162" rx="4.2" ry="8" transform="rotate(-10 188 162)"/>
              <ellipse cx="212" cy="162" rx="4.2" ry="8" transform="rotate(10 212 162)"/>
              <ellipse cx="196" cy="154" rx="3.8" ry="7.4" transform="rotate(-5 196 154)"/>
              <ellipse cx="204" cy="154" rx="3.8" ry="7.4" transform="rotate(5 204 154)"/>
            </g>
            <path d="M200 246 C199 214 199 186 200 150" stroke="#b9d79a" stroke-width="2.6" stroke-linecap="round" fill="none"/>
            <ellipse cx="200" cy="148" rx="4.4" ry="5.2" fill="#cfe6ad"/>
          </g>

          <!-- front petal, catches the light -->
          <path class="petal p-front" d="M200 252 C179 235 167 197 168 157 C169 119 183 96 200 87 C217 96 231 119 232 157 C233 197 221 235 200 252 Z" fill="url(#gLight)"/>
          <path class="petal p-front" d="M200 252 C179 235 167 197 168 157 C169 119 183 96 200 87 C217 96 231 119 232 157 C233 197 221 235 200 252 Z" fill="url(#gSheen)"/>
        </g>
      </g>
    </svg>
  </div>

  <p class="caption">for you <span>&#9825;</span></p>
  <button id="replay" type="button">Replay</button>
</main>

<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const host = document.getElementById('particles');

  function seedMotes(target) {
    target.textContent = '';
    for (let i = 0; i < 34; i++) {
      const c = document.createElementNS(NS, 'circle');
      const r = 0.6 + Math.random() * 1.7;
      c.setAttribute('cx', (Math.random() * 400).toFixed(1));
      c.setAttribute('cy', (120 + Math.random() * 470).toFixed(1));
      c.setAttribute('r', r.toFixed(2));
      c.setAttribute('fill', Math.random() > 0.65 ? '#e8c87a' : '#cfe3e0');
      c.setAttribute('class', 'mote');
      c.style.setProperty('--peak', (0.25 + Math.random() * 0.5).toFixed(2));
      c.style.animationDuration = (9 + Math.random() * 11).toFixed(1) + 's';
      c.style.animationDelay = (Math.random() * 12).toFixed(1) + 's';
      target.appendChild(c);
    }
  }
  seedMotes(host);

  document.getElementById('replay').addEventListener('click', () => {
    const scene = document.getElementById('scene');
    const fresh = scene.cloneNode(true);
    scene.replaceWith(fresh);
    seedMotes(fresh.querySelector('#particles'));

    ['.caption', '#replay'].forEach(sel => {
      const el = document.querySelector(sel);
      el.style.animation = 'none';
      void el.offsetWidth;
      el.style.animation = '';
    });
  });
})();
</script>

</body>
</html>
